# Linux x86_64; direct dependencies pinned to the experiment environment.
name: hc-rocp
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - timm==1.0.28
      - numpy==2.4.6
      - scipy==1.17.1
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - pillow==12.3.0
      - pyyaml==6.0.3
      - numba==0.67.0
